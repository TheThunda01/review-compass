" height="17" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="835" y="590.5">preserve a revision</text></g></g></g><g data-cell-id="edge7"><g transform="translate(0.5,0.5)"><path d="M 590 680 L 651.88 680" fill="none" stroke="#62808b" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(98, 128, 139), rgb(111, 137, 146));"/><path d="M 658.88 680 L 651.88 683.5 L 651.88 676.5 Z" fill="#62808b" stroke="#62808b" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(98, 128, 139), rgb(111, 137, 146)); stroke: light-dark(rgb(98, 128, 139), rgb(111, 137, 146));"/></g></g></g></g></g></svg>