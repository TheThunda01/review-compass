<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; color-scheme: light dark;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1161px" height="876px" viewBox="0 0 1161 876" id="ge-svg-OuIW8Tn7Sx1XQbGhx590"><style type="text/css">@supports (color: light-dark(#000, #fff)) { #ge-svg-OuIW8Tn7Sx1XQbGhx590 { --ge-adaptive-fg: light-dark(#000000, var(--ge-light-color, #ffffff)); } }</style><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="title"><g><rect x="20" y="20" width="1100" height="55" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#153c4a" font-family="Arial" font-weight="bold" text-anchor="start" font-size="24px" style="fill: light-dark(rgb(21, 60, 74), rgb(165, 198, 210));"><text x="32" y="60">Keep search drafting, execution, and records distinct</text></g></g></g><g data-cell-id="lane1"><g><rect x="25" y="100" width="200" height="35" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#425b65" font-family="Arial" text-anchor="start" font-size="14px" style="fill: light-dark(rgb(66, 91, 101), rgb(146, 167, 176));"><text x="37" y="130">BROWSER PLANNER</text></g></g></g><g data-cell-id="plan"><g transform="translate(0.5,0.5)"><rect x="30" y="155" width="235" height="95" rx="14.25" ry="14.25" fill="#eef4f8" stroke="#88a8b7" pointer-events="all" style="fill: light-dark(rgb(238, 244, 248), rgb(24, 29, 32)); stroke: light-dark(rgb(136, 168, 183), rgb(76, 103, 116));"/></g><g><g fill="#183c4d" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(24, 60, 77), rgb(166, 197, 212));"><text x="147.5" y="200">Question + eligibility</text><text x="147.5" y="219">Enter terms and plans</text></g></g></g><g data-cell-id="draft"><g transform="translate(0.5,0.5)"><rect x="310" y="155" width="235" height="95" rx="14.25" ry="14.25" fill="#e0f0ec" stroke="#528b79" pointer-events="all" style="fill: light-dark(rgb(224, 240, 236), rgb(23, 37, 34)); stroke: light-dark(rgb(82, 139, 121), rgb(92, 141, 126));"/></g><g><g fill="#173e32" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(23, 62, 50), rgb(166, 199, 189));"><text x="427.5" y="190.5">Generated query draft</text><text x="427.5" y="209.5">Inspect and revise syntax</text><text x="427.5" y="228.5">No database search occurs</text></g></g></g><g data-cell-id="cue"><g transform="translate(0.5,0.5)"><rect x="590" y="155" width="235" height="95" rx="14.25" ry="14.25" fill="#fff2d9" stroke="#b58b42" pointer-events="all" style="fill: light-dark(rgb(255, 242, 217), rgb(38, 27, 5)); stroke: light-dark(rgb(181, 139, 66), rgb(148, 111, 49));"/></g><g><g fill="#614618" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(97, 70, 24), rgb(196, 173, 133));"><text x="707.5" y="171.5">Literal keyword cues</text><text x="707.5" y="190.5">No context or negation</text><text x="707.5" y="209.5">model</text><text x="707.5" y="228.5">Every record needs human</text><text x="707.5" y="247.5">review</text></g></g></g><g data-cell-id="export"><g transform="translate(0.5,0.5)"><rect x="870" y="155" width="235" height="95" rx="14.25" ry="14.25" fill="#eef4f8" stroke="#88a8b7" pointer-events="all" style="fill: light-dark(rgb(238, 244, 248), rgb(24, 29, 32)); stroke: light-dark(rgb(136, 168, 183), rgb(76, 103, 116));"/></g><g><g fill="#183c4d" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(24, 60, 77), rgb(166, 197, 212));"><text x="987.5" y="190.5">Markdown export</text><text x="987.5" y="209.5">Current draft and notes</text><text x="987.5" y="228.5">No inclusion decision</text></g></g></g><g data-cell-id="lane2"><g><rect x="25" y="350" width="300" height="35" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#425b65" font-family="Arial" text-anchor="start" font-size="14px" style="fill: light-dark(rgb(66, 91, 101), rgb(146, 167, 176));"><text x="37" y="380">OPERATOR + COMMAND LINE</text></g></g></g><g data-cell-id="query"><g transform="translate(0.5,0.5)"><rect x="30" y="405" width="260" height="110" rx="16.5" ry="16.5" fill="#eef4f8" stroke="#88a8b7" pointer-events="all" style="fill: light-dark(rgb(238, 244, 248), rgb(24, 29, 32)); stroke: light-dark(rgb(136, 168, 183), rgb(76, 103, 116));"/></g><g><g fill="#183c4d" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(24, 60, 77), rgb(166, 197, 212));"><text x="160" y="438.5">Query file</text><text x="160" y="457.5">Structural audit + SHA-256</text><text x="160" y="476.5">A clean audit is not search</text><text x="160" y="495.5">validation</text></g></g></g><g data-cell-id="execute"><g transform="translate(0.5,0.5)"><rect x="345" y="405" width="260" height="110" rx="16.5" ry="16.5" fill="#fff2d9" stroke="#b58b42" pointer-events="all" style="fill: light-dark(rgb(255, 242, 217), rgb(38, 27, 5)); stroke: light-dark(rgb(181, 139, 66), rgb(148, 111, 49));"/></g><g><g fill="#614618" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(97, 70, 24), rgb(196, 173, 133));"><text x="475" y="438.5">Actual database</text><text x="475" y="457.5">Operator tests / executes</text><text x="475" y="476.5">search</text><text x="475" y="495.5">Outside Review Compass</text></g></g></g><g data-cell-id="record"><g transform="translate(0.5,0.5)"><rect x="660" y="405" width="260" height="110" rx="16.5" ry="16.5" fill="#e0f0ec" stroke="#528b79" pointer-events="all" style="fill: light-dark(rgb(224, 240, 236), rgb(23, 37, 34)); stroke: light-dark(rgb(82, 139, 121), rgb(92, 141, 126));"/></g><g><g fill="#173e32" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(23, 62, 50), rgb(166, 199, 189));"><text x="790" y="438.5">Operator-reported JSON</text><text x="790" y="457.5">Platform, date, limits,</text><text x="790" y="476.5">status, count</text><text x="790" y="495.5">Unknown count stays null</text></g></g></g><g data-cell-id="revision"><g transform="translate(0.5,0.5)"><rect x="660" y="630" width="260" height="100" rx="15" ry="15" fill="#eef4f8" stroke="#88a8b7" pointer-events="all" style="fill: light-dark(rgb(238, 244, 248), rgb(24, 29, 32)); stroke: light-dark(rgb(136, 168, 183), rgb(76, 103, 116));"/></g><g><g fill="#183c4d" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(24, 60, 77), rgb(166, 197, 212));"><text x="790" y="658.5">New revision record</text><text x="790" y="677.5">Prior ID + file hash +</text><text x="790" y="696.5">reason</text><text x="790" y="715.5">New ID and new output path</text></g></g></g><g data-cell-id="prior"><g transform="translate(0.5,0.5)"><rect x="290" y="630" width="300" height="100" rx="15" ry="15" fill="#fff2d9" stroke="#b58b42" pointer-events="all" style="fill: light-dark(rgb(255, 242, 217), rgb(38, 27, 5)); stroke: light-dark(rgb(181, 139, 66), rgb(148, 111, 49));"/></g><g><g fill="#614618" font-family="Arial" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(97, 70, 24), rgb(196, 173, 133));"><text x="440" y="649">Prior record stays unchanged</text><text x="440" y="668">Hash links bytes, not author</text><text x="440" y="687">identity</text><text x="440" y="706">History completeness is not</text><text x="440" y="725">established</text></g></g></g><g data-cell-id="notes"><g><rect x="40" y="770" width="1060" height="65" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#425b65" font-family="Arial" text-anchor="start" font-size="14px" style="fill: light-dark(rgb(66, 91, 101), rgb(146, 167, 176));"><text x="52" y="800">Draft records can be saved before execution. An “executed” status and count are supplied by the operator.</text><text x="52" y="817">The recorder does not verify that the search ran, certify coverage, or evaluate screening accuracy.</text></g></g></g><g data-cell-id="edge0"><g transform="translate(0.5,0.5)"><path d="M 265 202.5 L 301.88 202.5" fi